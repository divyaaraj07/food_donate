<script>
  function switchAuthTab(tab) {
    const signInBtn = document.getElementById('tabSignIn');
    const signUpBtn = document.getElementById('tabSignUp');
    const signInPanel = document.getElementById('signInPanel');
    const signUpForm = document.getElementById('signUpForm');

    if (tab === 'signin') {
      signInBtn.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm transition-all duration-200";
      signUpBtn.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md text-on-surface-variant transition-all duration-200";
      signInPanel.classList.remove('hidden');
      signInPanel.classList.add('flex');
      signUpForm.classList.add('hidden');
    } else {
      signUpBtn.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm transition-all duration-200";
      signInBtn.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md text-on-surface-variant transition-all duration-200";
      signUpForm.classList.remove('hidden');
      signInPanel.classList.add('hidden');
      signInPanel.classList.remove('flex');
    }
  }

  function togglePasswordVisibility(fieldId) {
    const input = document.getElementById(fieldId);
    if (!input) return;
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function showToast() {
    const toast = document.getElementById('verificationToast');
    if (toast) {
      toast.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
</script></main></body></html>
